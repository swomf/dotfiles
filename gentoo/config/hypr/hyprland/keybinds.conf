# ######################### Typical talk-to-hardware keybinds #########################
# Volume
bindl  =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle  
bindle =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+

# Brightness
bindle=, XF86MonBrightnessUp, exec, brightnessctl set '50+'
bindle=, XF86MonBrightnessDown, exec, brightnessctl set '50-'

# ################################### Applications ####################################
# Apps: just normal apps
# Note: for VSCode you need to place "password-store: gnome" in ~/.vscode/argv.json
bind = Super, C, exec, code --password-store=gnome-libsecret --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = Super, T, exec, foot --working-directory "$(~/.config/hypr/executable/hyprcwd)"
bind = Control+Alt, T, exec, kitty --directory "$(~/.config/hypr/executable/hyprcwd)"
#bind = Super, E, exec, nautilus --new-window
bind = Super, E, exec, thunar
bind = Super, F, exec, firefox || firefox-bin
bind = Control+Shift+Super, P, exec, firefox --private-window || firefox-bin --private-window
bind = Super, M, exec, mullvad-browser
bind = Super, O, exec, ~/.config/hypr/executable/gotoapp -a obsidian
bind = Super+Alt, O, exec, ~/.config/hypr/executable/gotoapp -a obsidian -b

#bind = Control+Super, V, exec, pavucontrol
bind = Control+Super+Shift, V, exec, ~/.config/hypr/executable/gotoapp -c com.github.wwmm.easyeffects -a easyeffects
bind = Control+Shift, Escape, exec, foot -- btop

# Actions
bind = Super, Period, exec, pkill fuzzel || ~/.config/hypr/executable/fuzzel-emoji
bind = Super, Q, killactive,
bind = Alt, F4, killactive,
bind = Shift+Alt, F, exec, ~/.config/hypr/executable/togglefloatcenter
bind = Super+Alt, F, togglefloating,
bind = Super+Shift, F, togglefloating,
bind = Control+Shift+Alt, F, togglefloating,
bind = Control+Shift+Alt, F, resizeactive, exact 640 480
bind = Shift+Super+Alt, F, exec, ~/.config/hypr/executable/togglefloatcenter
bind = Shift+Super+Alt, Q, exec, hyprctl kill

# Screenshot, Record, OCR, Color picker, Clipboard history
# remember: slurp picks the region, grim screenshots a geometry, swappy edits a picture
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = Control, Print, exec, grim - | wl-copy && notify-send "Screenshot copied to clipboard" "grim - | wl-copy" --app-name="screenshot" -t 2000
bind = Super, V, exec, cliphist list | anyrun --show-results-immediately true --plugins libstdin.so | cliphist decode | wl-copy

# According to https://github.com/hyprwm/Hyprland/discussions/9964
# gpu_screen_recorder::guru is better than grim, but
# sometimes gpu_screen_recorder is offset by a constant value in my findings :/
#bind = , Print, exec, gpu-screen-recorder -w region -region $(slurp -f "%wx%h+%x+%y") -o "/tmp/qsr-tmp.png" && cat "/tmp/qsr-tmp.png" | swappy -f -
#bind = Control, Print, exec, gpu-screen-recorder -w screen -o "/tmp/qsr-tmp.png" && cat "/tmp/qsr-tmp.png" | wl-copy

# Image-to-text
bind = Super+Shift, T, exec, grim -g "$(slurp)" - | tesseract stdin stdout -l eng+jpn | wl-copy
#bind = Super+Shift, T,exec, gpu-screen-recorder -w region -region $(slurp -f "%wx%h+%x+%y") -o "/tmp/gsr-tmp.png" && tesseract -l eng "/tmp/gsr-tmp.png" - | wl-copy
#bind = Super+Shift, J,exec, gpu-screen-recorder -w region -region $(slurp -f "%wx%h+%x+%y") -o "/tmp/gsr-tmp.png" && tesseract -l jpn "/tmp/gsr-tmp.png" - | wl-copy

# Lock screen
bind = Super, L, exec, ~/.config/hypr/executable/hyprlock

# App launcher
bind = Super, R, exec, pkill anyrun && anyrun || anyrun

# ########################### Keybinds for Hyprland ############################
# Swap windows
bind = Super+Shift, left, movewindow, l
bind = Super+Shift, A, movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, D, movewindow, r
bind = Super+Shift, up, movewindow, u
bind = Super+Shift, W, movewindow, u
bind = Super+Shift, down, movewindow, d
bind = Super+Shift, S, movewindow, d
bind = Super, P, pin
# Move focus (arrow keys and WASD)
bind = Super, left, movefocus, l
bind = Super, A, movefocus, l
bind = Super, right, movefocus, r
bind = Super, D, movefocus, r
bind = Super, up, movefocus, u
bind = Super, W, movefocus, u
bind = Super, down, movefocus, d
bind = Super, S, movefocus, d
bind = Super, BracketLeft, movefocus, l
bind = Super, BracketRight, movefocus, r

# Workspace, window, tab switch with keyboard
bind = Control+Super, right, workspace, +1
bind = Control+Super, D, workspace, +1
bind = Control+Super, left, workspace, -1
bind = Control+Super, A, workspace, -1
bind = Super, mouse:275, workspace, -1
bind = Super, mouse:276, workspace, +1
bind = Control+Super, BracketLeft, workspace, -1
bind = Control+Super, BracketRight, workspace, +1
bind = Control+Super, up, exec, test "$(hyprctl activeworkspace -j|jq '.id')" -le 20 || hyprctl dispatch workspace -20;
bind = Control+Super, W, exec, test "$(hyprctl activeworkspace -j|jq '.id')" -le 20 || hyprctl dispatch workspace -20;
bind = Control+Super, down, workspace, +20
bind = Control+Super, S, workspace, +20
bind = Control+Shift+Super, up, exec, test "$(hyprctl activeworkspace -j|jq '.id')" -le 20 || hyprctl dispatch movetoworkspace -20;
bind = Control+Shift+Super, W, exec, test "$(hyprctl activeworkspace -j|jq '.id')" -le 20 || hyprctl dispatch movetoworkspace -20;
bind = Control+Shift+Super, down, movetoworkspace, +20
bind = Control+Shift+Super, S, movetoworkspace, +20
bind = Super, Page_Down, workspace, +1
bind = Super, Page_Up, workspace, -1
bind = Control+Super, Page_Down, workspace, +1
bind = Control+Super, Page_Up, workspace, -1
bind = Super+Alt, Page_Down, movetoworkspace, +1
bind = Super+Alt, Page_Up, movetoworkspace, -1
bind = Super+Shift, Page_Down, movetoworkspace, +1
bind = Super+Shift, Page_Up, movetoworkspace, -1
bind = Control+Super+Shift, Right, movetoworkspace, +1
bind = Control+Super+Shift, D, movetoworkspace, +1
bind = Control+Super+Shift, Left, movetoworkspace, -1
bind = Control+Super+Shift, A, movetoworkspace, -1
bind = Super+Shift, mouse_down, movetoworkspace, -1
bind = Super+Shift, mouse_up, movetoworkspace, +1
bind = Super+Alt, mouse_down, movetoworkspace, -1
bind = Super+Alt, mouse_up, movetoworkspace, +1

# Window split ratio
binde = Super, Minus, splitratio, -0.1
binde = Super, Equal, splitratio, 0.1
binde = Super, Semicolon, splitratio, -0.1
binde = Super, Apostrophe, splitratio, 0.1

# Fullscreen
bind = , F11, fullscreen, 0
bind = Shift, F11, fullscreenstate, 1 -1
bind = Super, F11, fullscreenstate, -1 3

# Switching
bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super, 6, workspace, 6
bind = Super, 7, workspace, 7
bind = Super, 8, workspace, 8
bind = Super, 9, workspace, 9
bind = Super, 0, workspace, 10
bind = Super+Shift, 1, workspace, 11
bind = Super+Shift, 2, workspace, 12
bind = Super+Shift, 3, workspace, 13
bind = Super+Shift, 4, workspace, 14
bind = Super+Shift, 5, workspace, 15
bind = Super+Shift, 6, workspace, 16
bind = Super+Shift, 7, workspace, 17
bind = Super+Shift, 8, workspace, 18
bind = Super+Shift, 9, workspace, 19
bind = Super+Shift, 0, workspace, 20

bind = Alt, Tab, cyclenext
bind = Alt, Tab, bringactivetotop
bind = Shift+Alt, Tab, cyclenext, prev
bind = Shift+Alt, Tab, bringactivetotop

# Move window to workspace Super + Alt + [0-9]
bind = Super+Alt, 1, movetoworkspacesilent, 1
bind = Super+Alt, 2, movetoworkspacesilent, 2
bind = Super+Alt, 3, movetoworkspacesilent, 3
bind = Super+Alt, 4, movetoworkspacesilent, 4
bind = Super+Alt, 5, movetoworkspacesilent, 5
bind = Super+Alt, 6, movetoworkspacesilent, 6
bind = Super+Alt, 7, movetoworkspacesilent, 7
bind = Super+Alt, 8, movetoworkspacesilent, 8
bind = Super+Alt, 9, movetoworkspacesilent, 9
bind = Super+Alt, 0, movetoworkspacesilent, 10
bind = Super+Shift+Alt, 1, movetoworkspacesilent, 11
bind = Super+Shift+Alt, 2, movetoworkspacesilent, 12
bind = Super+Shift+Alt, 3, movetoworkspacesilent, 13
bind = Super+Shift+Alt, 4, movetoworkspacesilent, 14
bind = Super+Shift+Alt, 5, movetoworkspacesilent, 15
bind = Super+Shift+Alt, 6, movetoworkspacesilent, 16
bind = Super+Shift+Alt, 7, movetoworkspacesilent, 17
bind = Super+Shift+Alt, 8, movetoworkspacesilent, 18
bind = Super+Shift+Alt, 9, movetoworkspacesilent, 19
bind = Super+Shift+Alt, 0, movetoworkspacesilent, 20

# Special workspace
bind = Control+Super, X, togglespecialworkspace,
bind = Super+Alt, X, movetoworkspacesilent, special

# Scroll through existing workspaces with (Control) + Super + scroll
bind = Super, mouse_up, workspace, +1
bind = Super, mouse_down, workspace, -1
bind = Control+Super, mouse_up, workspace, +1
bind = Control+Super, mouse_down, workspace, -1

# Move/resize windows with Super + LMB/RMB and dragging
bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow
# bindm = Super, mouse:274, movewindow
bind = Super+Alt, right, resizeactive, 20 0
bind = Super+Alt, left, resizeactive, -20 0
bind = Super+Alt, up, resizeactive, 0 -20
bind = Super+Alt, down, resizeactive, 0 20
#bind = Control+Super, Backslash, resizeactive, exact 640 480

# Spin monitor
bind = Control+Shift+Alt, Left, exec, ~/.config/hypr/executable/spin left
bind = Control+Shift+Alt, Down, exec, ~/.config/hypr/executable/spin down
bind = Control+Shift+Alt, Up, exec, ~/.config/hypr/executable/spin up
bind = Control+Shift+Alt, Right, exec, ~/.config/hypr/executable/spin right

# blur a window
bind = Super, B, exec, hyprctl dispatch tagwindow blurry
